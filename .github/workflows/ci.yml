name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Security smoke
        env:
          BASE: http://127.0.0.1:3011
        run: |
          PORT=3011 node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3011/api/games >/dev/null && break
            sleep 1
          done
          npm run test:security
          kill $SERVER_PID || true

      - name: Music provider unit tests
        run: npm run test:music
        continue-on-error: true
