name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 隔离数据库：CI 冒烟会创建测试账号，不隔离会污染仓库内 data/chat.db
      PERRY_DATA_DIR: ${{ github.workspace }}/.ci-data
      BASE: http://127.0.0.1:3011
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 第三方/构建产物已在 eslint.config.js 的 ignores 中排除，可全量严格校验
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Security smoke
        run: |
          mkdir -p .ci-data
          PORT=3011 node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3011/api/games >/dev/null && break
            sleep 1
          done
          npm run test:security
          npm run test:listen
          kill $SERVER_PID || true
