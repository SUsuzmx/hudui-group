<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ededed" />
  <!-- iOS 安装为 PWA 后支持后台音频 / 锚点媒体中心（灵动岛区域 Now Playing） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WeChat" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>WeChat</title>
  <style>
    /* 首屏骨架：JS 解析/执行期间避免白屏 */
    html, body, #app { height: 100%; margin: 0; background: #ededed; }
    .boot-splash {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b2b2b2;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body>
  <div id="app"><div class="boot-splash">加载中…</div></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // 空闲时注册，不抢首屏解析/网络
      const registerSw = async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          // 强制检查更新, 避免旧 SW 缓存导致游戏/页面打不开
          if (reg && reg.update) reg.update();
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready.then((r) => r && r.update && r.update()).catch(() => {});
          }
        } catch (e) { /* ignore */ }
      };
      if ('requestIdleCallback' in window) {
        window.addEventListener('load', () => {
          window.requestIdleCallback(registerSw, { timeout: 2000 });
        });
      } else {
        window.addEventListener('load', registerSw);
      }
    }
  </script>
</body>
</html>
