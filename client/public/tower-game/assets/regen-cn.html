<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: wenxue; src: url("file:///C:/perry/games/tower_game/assets/wenxue.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: wenxue; }
  .stage { position: relative; }
  .shot { display: inline-block; }
</style>
</head>
<body>
<div class="shot" id="start"></div><br>
<div class="shot" id="replay"></div><br>
<div class="shot" id="share"></div><br>
<div class="shot" id="over"></div><br>
<div class="shot" id="score"></div><br>
<div class="shot" id="tutorial"></div>

<script>
// 通用: 圆角按钮(渐变面+描边+底影) + 图标 + 带白描边的文字
function buttonSVG(w, h, face1, face2, borderColor, shadowColor, iconSVG, text) {
  const r = h * 0.36, bw = h * 0.10; // 圆角与边框宽度
  const textX = iconSVG ? w * 0.60 : w / 2;
  return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${face1}"/><stop offset="1" stop-color="${face2}"/>
      </linearGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9a3"/><stop offset="0.45" stop-color="#f6b23c"/>
        <stop offset="0.55" stop-color="#e8912a"/><stop offset="1" stop-color="#d97718"/>
      </linearGradient>
    </defs>
    <rect x="${bw}" y="${bw + h*0.06}" width="${w - bw*2}" height="${h - bw*2}" rx="${r}" fill="${shadowColor}"/>
    <rect x="${bw*0.5}" y="${bw*0.5}" width="${w - bw}" height="${h - bw - h*0.06}" rx="${r}" fill="${borderColor}"/>
    <rect x="${bw*1.1}" y="${bw*1.1}" width="${w - bw*2.2}" height="${h - bw*2.2 - h*0.06}" rx="${r*0.85}" fill="url(#face)"/>
    <rect x="${bw*1.1}" y="${bw*1.1}" width="${w - bw*2.2}" height="${(h - bw*2.2 - h*0.06)*0.55}" rx="${r*0.85}" fill="url(#gloss)"/>
    ${iconSVG || ""}
    <text x="${textX}" y="${h/2 + h*0.03}" font-family="wenxue" font-weight="bold" font-size="${h*0.42}"
      text-anchor="middle" dominant-baseline="middle" fill="#ffffff"
      stroke="rgba(0,0,0,0.25)" stroke-width="${h*0.02}" paint-order="stroke">${text}</text>
  </svg>`;
}

document.getElementById("start").innerHTML = buttonSVG(459, 141, "#f2606b", "#e04a52", "#f8e4c9", "#c23b42",
  `<path d="M ${459*0.155} ${141*0.26} L ${459*0.155+72} ${141*0.5} L ${459*0.155} ${141*0.74} Z"
     fill="#8fd8ee" stroke="#4da4c4" stroke-width="7" stroke-linejoin="round"/>`, "开始游戏");

document.getElementById("replay").innerHTML = buttonSVG(459, 138, "#54a9f5", "#3a83e2", "#cfe9ff", "#2a63b8",
  `<g transform="translate(${459*0.30},${138*0.5})">
     <path d="M -26 8 A 26 26 0 1 1 -8 25" fill="none" stroke="#e8453c" stroke-width="13" stroke-linecap="round"/>
     <path d="M -34 -14 L -6 -6 L -28 12 Z" fill="#e8453c"/>
   </g>`, "再来一局");

document.getElementById("share").innerHTML = buttonSVG(459, 141, "#f8a95e", "#ef8440", "#fdeacb", "#cf6f2e",
  `<g transform="translate(${459*0.29},${141*0.5})">
     <path d="M -30 -6 L 8 -22 L 8 22 L -30 6 Z" fill="#f3f0ea" stroke="#c9c4bb" stroke-width="4" stroke-linejoin="round"/>
     <rect x="-36" y="-6" width="10" height="12" rx="3" fill="#f3f0ea" stroke="#c9c4bb" stroke-width="4"/>
     <path d="M 14 -14 Q 26 0 14 14" fill="none" stroke="#f3f0ea" stroke-width="6" stroke-linecap="round"/>
     <path d="M 22 -24 Q 40 0 22 24" fill="none" stroke="#f3f0ea" stroke-width="6" stroke-linecap="round"/>
   </g>`, "邀请好友");

// 游戏结束: 金色渐变字 + 白描边, 透明背景
document.getElementById("over").innerHTML = `<svg width="556" height="190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeaa6"/><stop offset="0.45" stop-color="#f4b23d"/>
      <stop offset="0.55" stop-color="#e89429"/><stop offset="1" stop-color="#cf7114"/>
    </linearGradient>
  </defs>
  <text x="278" y="78" font-family="wenxue" font-weight="bold" font-size="104"
    text-anchor="middle" dominant-baseline="middle" fill="url(#gold2)"
    stroke="#ffffff" stroke-width="14" paint-order="stroke" stroke-linejoin="round">游戏结束</text>
  <text x="278" y="158" font-family="wenxue" font-weight="bold" font-size="66"
    text-anchor="middle" dominant-baseline="middle" fill="url(#gold2)"
    stroke="#ffffff" stroke-width="11" paint-order="stroke" stroke-linejoin="round">得分</text>
</svg>`;

// 得分: 玻璃质感胶囊, 文字靠左
document.getElementById("score").innerHTML = `<svg width="409" height="131" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5148" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#2c2620" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#15100c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="401" height="123" rx="40" fill="url(#glass)" stroke="#efe9df" stroke-width="7"/>
  <rect x="14" y="12" width="381" height="48" rx="24" fill="#ffffff" opacity="0.14"/>
  <circle cx="52" cy="38" r="12" fill="#ffffff" opacity="0.9"/>
  <text x="160" y="72" font-family="wenxue" font-weight="bold" font-size="64"
    text-anchor="middle" dominant-baseline="middle" fill="#ffffff"
    stroke="#8a5a20" stroke-width="10" paint-order="stroke" stroke-linejoin="round">得分</text>
</svg>`;

// 教程提示: 金色 "点击!" 透明背景
document.getElementById("tutorial").innerHTML = `<svg width="181" height="85" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset="0.5" stop-color="#f5b23a"/>
      <stop offset="1" stop-color="#e08a20"/>
    </linearGradient>
  </defs>
  <text x="90" y="46" font-family="wenxue" font-weight="bold" font-size="58"
    text-anchor="middle" dominant-baseline="middle" fill="url(#gold3)"
    stroke="#ffffff" stroke-width="10" paint-order="stroke" stroke-linejoin="round">点击!</text>
</svg>`;
</script>
</body>
</html>
