<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ededed" />
  <title>当前处于离线</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #ededed;
      color: #191919;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px calc(32px + env(safe-area-inset-bottom, 0px));
      padding-top: calc(32px + env(safe-area-inset-top, 0px));
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 18px;
      background: #d9d9d9; display: flex; align-items: center; justify-content: center;
      font-size: 34px; margin-bottom: 18px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    p { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 8px; max-width: 320px; }
    ul {
      text-align: left; max-width: 320px; margin: 12px auto 20px;
      padding: 14px 16px; background: #fff; border-radius: 12px;
      font-size: 13px; color: #555; line-height: 1.7;
    }
    .ok { color: #07c160; }
    .no { color: #b2b2b2; }
    .btn {
      border: 0; border-radius: 999px; padding: 12px 28px;
      background: #07c160; color: #fff; font-size: 15px;
      min-height: 44px;
    }
    .btn:active { opacity: 0.85; }
    .tip { margin-top: 16px; font-size: 12px; color: #b2b2b2; }
  </style>
</head>
<body>
  <div class="icon">📶</div>
  <h1>当前处于离线</h1>
  <p>网络似乎断开了。恢复连接后聊天记录、在线音乐会自动同步。</p>
  <ul>
    <li class="ok">✓ 已缓存的页面与图标</li>
    <li class="no">✕ 聊天收发（需要网络）</li>
    <li class="no">✕ 在线音乐 / 一起听</li>
    <li class="no">✕ 朋友圈刷新与上传</li>
    <li class="ok">✓ 本地设置与草稿仍保留</li>
  </ul>
  <button class="btn" type="button" onclick="location.reload()">重新连接</button>
  <p class="tip">若长期无法恢复，请检查 Wi‑Fi / 蜂窝数据或代理设置</p>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
